# CodeQL 静态分析(SAST)—— 补 OpenSSF Scorecard 的 SAST 项;公开仓免费。
# 只扫 Python(产品代码);actions 全锁 commit 哈希(不给自己再挖 Pinned-Dependencies)。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "25 6 * * 1"   # 每周一 06:25 UTC 兜底扫一遍

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write   # 上报告警到 code scanning
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: python
          # 默认(code-scanning/security)高精度规则集:抓 path/command/sql-injection、凭证明文、
          # SSRF 等**核心安全**查询,不跑 -extended 的低精度项、更不跑 -and-quality 的可维护性噪音
          # (那是 ruff 的活)。养一个可维护的 SAST,不是噪音消防栓。
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:python"
