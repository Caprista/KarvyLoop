# CodeQL 静态分析(SAST)—— 补 OpenSSF Scorecard 的 SAST 项;公开仓免费。
# 只扫 Python(产品代码);actions 全锁 commit 哈希(不给自己再挖 Pinned-Dependencies)。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "25 6 * * 1"   # 每周一 06:25 UTC 兜底扫一遍

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write   # 上报告警到 code scanning
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: python
          # 只跑**安全**查询(security-extended);不跑 -and-quality 的可维护性查询
          # (unused-var / string-concat 等 100+ 条噪音 = ruff 的活,ruff 已绿)。SAST 要的是安全信号。
          queries: security-extended
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:python"
